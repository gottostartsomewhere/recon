name: Keep the demo awake

# Render's free tier sleeps after 15 idle minutes, and waking it can take
# minutes. Pinging the health endpoint (no model or search calls) keeps the
# public demo warm. GitHub sometimes runs scheduled jobs late, so this backs up
# an external pinger rather than replacing it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        # A failed ping is logged, not failed, so a slow wake-up doesn't send
        # a failure email every five minutes.
        run: |
          curl -sS --max-time 150 -w '\nHTTP %{http_code} in %{time_total}s\n' \
            https://recon-ckfe.onrender.com/api/health || echo "Ping failed"
